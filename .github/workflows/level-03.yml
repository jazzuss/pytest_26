name: "Level 03 · When Things Go Wrong"

# Runs when something this level depends on changes (or when you start it by hand).
on:
  push:
    paths:
      - "tests/level_03/**"
      - "tests/conftest.py"
      - "src/**"
      - "grader/**"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/level-03.yml"
      - ".github/workflows/_level.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  level:
    uses: ./.github/workflows/_level.yml
    with:
      level: 3
